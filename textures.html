<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Texture Gallery</title>
  <style>
    body { margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; font: 14px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 18px; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { padding: 12px; border-radius: 10px; background: #1e293b; }
    .card h2 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
    .pair { display: flex; gap: 8px; }
    .pair figure { margin: 0; flex: 1; }
    .pair canvas { width: 100%; aspect-ratio: 1; border-radius: 6px; image-rendering: auto; }
    figcaption { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .swatches { display: flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
    .swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #475569; }
    .ok { color: #4ade80; } .bad { color: #f87171; }
  </style>
</head>
<body>
  <h1>Texture Gallery</h1>
  <p>Every material's procedural textures (painted at load, seamless, seeded). The measured average of each top texture is compared with the swatch the visual audit uses (ΔE ≤ 8).</p>
  <div class="grid" id="grid"></div>
  <script type="module" src="./src/textureGallery.js"></script>
</body>
</html>
