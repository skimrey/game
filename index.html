<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platformer outline</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <canvas id="game" aria-label="3D platformer game"></canvas>
    <div class="hud">
      <h1>Platformer outline</h1>
      <p id="status" aria-live="polite">Loading…</p>
      <p>WASD / arrow keys to move · Space to jump · R to restart</p>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
