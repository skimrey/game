<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platformer outline</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <canvas id="game" aria-label="3D platformer game"></canvas>
    <div id="tier-banner" class="tier-banner" aria-hidden="true">
      <span class="tier-label"></span>
      <span class="tier-name"></span>
    </div>
    <div class="hud">
      <h1>Platformer outline</h1>
      <p id="status" aria-live="polite">Loading…</p>
      <p>WASD / arrows move · Space jump · Shift/J air dash · Q/K ground pound · R restart</p>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
